[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "salasforge"
version = "0.1.0"
description = "An end-to-end enterprise data engineering platform for reproducible supply-chain analytics."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "SalasForge contributors"}]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
salasforge = "salasforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/salasforge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
