# Temporary one-time bootstrap. Removed after uv.lock has been committed.
name: Bootstrap dependency lock
on:
  push:
    branches:
      - feat/postgres-bootstrap-uv-ci
    paths:
      - .github/workflows/bootstrap-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.10.0"
      - name: Resolve dependency lock
        run: uv lock
      - name: Commit generated lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: add reproducible uv dependency lock"
            git push origin HEAD:feat/postgres-bootstrap-uv-ci
          fi
